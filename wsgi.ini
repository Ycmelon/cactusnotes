[uwsgi]
module = wsgi:app

master = true

# Keep it small: 1 worker process only (safe for 512 MB)
processes = 1

# Socket for Nginx <-> uWSGI
socket = cactusnotes.sock
chmod-socket = 660
vacuum = true

die-on-term = true

# Disable threads unless you really need them
#enable-threads = false

# Each worker loads the app separately
lazy-apps = true

# --- Memory / stability guards ---
# Restart worker if it uses too much RAM
reload-on-rss = 128     # MB
reload-on-as = 256      # MB

# Recycle worker regularly to prevent leaks
max-requests = 500
max-requests-delta = 100

respawn = true

